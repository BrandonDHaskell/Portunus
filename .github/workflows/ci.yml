name: CI

# Every job calls the same Taskfile task that `task ci:all` runs locally, so a
# local pass predicts a CI pass. Add a check to the Taskfile first, then here.
#
# Actions are pinned to commit SHAs and the IDF image to a digest; Dependabot
# (.github/dependabot.yml) proposes updates. Job names are required status
# checks on main: renaming one means updating the ruleset too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TASK_VERSION: 3.49.1

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Current stable Go, not go.mod's minimum: tests, vet and govulncheck
      # should see the standard library the server is actually built with.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: server/go.sum

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: vet + fmt + test (race detector) + TLS boot smoke
        run: task ci:server

      - name: go.mod / go.sum tidy
        run: task tidy:server:check

      - name: Cross-compile for the Pi (linux/arm64, CGO_ENABLED=0)
        run: task build:server:arm64

      - name: govulncheck
        run: task vuln:server

  proto-check:
    name: Proto drift
    # protoc comes from apt and its version is written into the generated Go
    # stubs: Ubuntu 24.04 ships 3.21.12, the committed version. Moving to a
    # newer runner image means regenerating with its protoc.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod's version: proto_gen.py builds the plugins with that toolchain,
      # so installing it here avoids a download.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler

      - name: Install nanopb
        run: pip install nanopb==0.4.9.1

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for proto drift
        run: task proto:check IDF_PYTHON=python3

  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile with the CI overlay
        run: |
          . $IDF_PATH/export.sh
          task firmware:compile:ci

  firmware-unit:
    name: Firmware unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build gcc-multilib g++-multilib

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tier (native)
        run: task test:firmware:unit

      - name: Unit tier (ASan + UBSan)
        run: task test:firmware:unit PRESET=host-asan

      - name: Unit tier (ESP32-S3 data model, 32-bit)
        run: task test:firmware:unit:m32

  firmware-component:
    name: Firmware component + integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Includes the Kconfig override allowlist check (COMP-05).
      - name: Component tier (all variants)
        run: |
          . $IDF_PATH/export.sh
          task test:firmware:component

      - name: Integration tier (real event bus)
        run: |
          . $IDF_PATH/export.sh
          task test:firmware:integration

      # The hardware tier runs on a bench board (task test:firmware:hardware);
      # CI only compiles it so it cannot rot.
      - name: Hardware tier apps (compile only)
        run: |
          . $IDF_PATH/export.sh
          task test:firmware:hardware:compile

  firmware-prod-compile:
    name: Firmware compile (prod profile, HMAC + pinned CA)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Throwaway CA so the CONFIG_PORTUNUS_TLS_USE_CUSTOM_CA embed succeeds.
      # Compile-only: this image is never flashed.
      - name: Generate throwaway CA
        run: bash scripts/generate_certs.sh --ip 127.0.0.1

      - name: Compile with the prod overlay and assert it is deployable
        run: |
          . $IDF_PATH/export.sh
          task firmware:compile:prod

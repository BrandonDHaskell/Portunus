name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: server/go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: vet + fmt + test (race detector)
        run: task ci:server

  proto-check:
    name: Proto drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler

      - name: Install Go proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
        working-directory: server

      - name: Install nanopb
        run: pip install nanopb==0.4.9.1

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for proto drift
        run: task proto:check IDF_PYTHON=python3

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        working-directory: access_module
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.ci"
        run: |
          . $IDF_PATH/export.sh
          idf.py build

  firmware-unit:
    name: Firmware unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build gcc-multilib g++-multilib

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tier (native)
        run: task test:firmware:unit

      - name: Unit tier (ASan + UBSan)
        run: task test:firmware:unit PRESET=host-asan

      - name: Unit tier (32-bit size_t, ESP32 width)
        run: task test:firmware:unit:m32

  firmware-component:
    name: Firmware component + integration tests
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      # idf.py is called directly (as in the Firmware job): the Taskfile's
      # IDF_PYTHON default points at a developer-machine venv path.
      - name: Test Kconfig overrides are allowlisted (COMP-05)
        run: access_module/test/component/check_kconfig_overrides.sh

      # Each build keeps its own sdkconfig; SDKCONFIG must be absolute.
      - name: Component tier, access point (fake event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/fake -D SDKCONFIG=$APP/build/fake/sdkconfig \
            set-target linux build
          $APP/build/fake/portunus_host_tests.elf

      - name: Component tier, provisioning console (fake event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/peu -D SDKCONFIG=$APP/build/peu/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.peu" set-target linux build
          $APP/build/peu/portunus_host_tests.elf

      - name: Component tier, heartbeat service (fake event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/hb -D SDKCONFIG=$APP/build/hb/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.hb" set-target linux build
          $APP/build/hb/portunus_host_tests.elf

      - name: Component tier, portunus_nvs (emulated flash)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/nvs -D SDKCONFIG=$APP/build/nvs/sdkconfig \
            -DPORTUNUS_TEST_NVS=ON set-target linux build
          $APP/build/nvs/portunus_host_tests.elf

      - name: Integration tier (real event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/real -D SDKCONFIG=$APP/build/real/sdkconfig \
            -DPORTUNUS_TEST_REAL_BUS=ON set-target linux build
          $APP/build/real/portunus_host_tests.elf

  firmware-prod-compile:
    name: Firmware compile (prod profile, HMAC + pinned CA)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      # Throwaway CA so the CONFIG_PORTUNUS_TLS_USE_CUSTOM_CA embed succeeds.
      # Compile-only: this image is never flashed.
      - name: Generate throwaway CA
        run: bash scripts/generate_certs.sh --ip 127.0.0.1

      - name: Build with prod overlay
        working-directory: access_module
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.prod"
        run: |
          . $IDF_PATH/export.sh
          idf.py build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: server/go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: vet + fmt + test (race detector)
        run: task ci:server

  proto-check:
    name: Proto drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler

      - name: Install nanopb
        run: pip install nanopb==0.4.9.1

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for proto drift
        run: task proto:check IDF_PYTHON=python3

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        working-directory: access_module
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.ci"
        run: |
          . $IDF_PATH/export.sh
          idf.py build

  firmware-unit:
    name: Firmware unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build gcc-multilib g++-multilib

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tier (native)
        run: task test:firmware:unit

      - name: Unit tier (ASan + UBSan)
        run: task test:firmware:unit PRESET=host-asan

      - name: Unit tier (ESP32-S3 data model, 32-bit)
        run: task test:firmware:unit:m32

  firmware-component:
    name: Firmware component + integration tests
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      # idf.py is called directly (as in the Firmware job): the Taskfile's
      # IDF_PYTHON default points at a developer-machine venv path.
      - name: Test Kconfig overrides are allowlisted (COMP-05)
        run: access_module/test/component/check_kconfig_overrides.sh

      # Each build keeps its own sdkconfig; SDKCONFIG must be absolute.
      - name: Component tier, access point (fake event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/fake -D SDKCONFIG=$APP/build/fake/sdkconfig \
            set-target linux build
          $APP/build/fake/portunus_host_tests.elf

      - name: Component tier, provisioning console (fake event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/peu -D SDKCONFIG=$APP/build/peu/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.peu" set-target linux build
          $APP/build/peu/portunus_host_tests.elf

      - name: Component tier, heartbeat service (fake event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/hb -D SDKCONFIG=$APP/build/hb/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.hb" set-target linux build
          $APP/build/hb/portunus_host_tests.elf

      - name: Component tier, WiFi reconnect task (fake callbacks)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/wifi -D SDKCONFIG=$APP/build/wifi/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.wifi" set-target linux build
          $APP/build/wifi/portunus_host_tests.elf

      - name: Component tier, server_comm (access point, no-HMAC dev, PEU)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          for V in "sc:sdkconfig.defaults;sdkconfig.defaults.sc" \
                   "sc-nohmac:sdkconfig.defaults;sdkconfig.defaults.sc;sdkconfig.defaults.sc_nohmac" \
                   "sc-peu:sdkconfig.defaults;sdkconfig.defaults.sc;sdkconfig.defaults.peu"; do
            N=${V%%:*}; D=${V#*:}
            idf.py --preview -C $APP -B $APP/build/$N -D SDKCONFIG=$APP/build/$N/sdkconfig \
              -D "SDKCONFIG_DEFAULTS=$D" -DPORTUNUS_TEST_SERVER_COMM=ON set-target linux build
            $APP/build/$N/portunus_host_tests.elf
          done

      - name: Component tier, portunus_nvs (emulated flash)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/nvs -D SDKCONFIG=$APP/build/nvs/sdkconfig \
            -DPORTUNUS_TEST_NVS=ON set-target linux build
          $APP/build/nvs/portunus_host_tests.elf

      # The hardware tier runs on a bench board (task test:firmware:hardware);
      # CI only compiles it so it cannot rot.
      - name: Hardware tier app (compile only, both variants)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/hardware
          for V in "active_high:sdkconfig.defaults" \
                   "active_low:sdkconfig.defaults;sdkconfig.defaults.active_low"; do
            N=${V%%:*}; D=${V#*:}
            idf.py -C $APP -B $APP/build/$N -D SDKCONFIG=$APP/build/$N/sdkconfig \
              -D "SDKCONFIG_DEFAULTS=$D" build
          done

      # The network app pins a CA at build time; the runner makes a throwaway
      # one. CI compiles against a throwaway of its own (the key is discarded).
      - name: Hardware tier network app (compile only)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/hardware/net
          mkdir -p $APP/certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout /tmp/ci-compile-ca.key -out $APP/certs/ca_cert.pem -days 1 \
            -subj "/CN=ci-compile-only" 2>/dev/null
          idf.py -C $APP -B $APP/build/net -D SDKCONFIG=$APP/build/net/sdkconfig build

      - name: Integration tier (real event bus)
        run: |
          . $IDF_PATH/export.sh
          APP=$PWD/access_module/test/component
          idf.py --preview -C $APP -B $APP/build/real -D SDKCONFIG=$APP/build/real/sdkconfig \
            -DPORTUNUS_TEST_REAL_BUS=ON set-target linux build
          $APP/build/real/portunus_host_tests.elf

  firmware-prod-compile:
    name: Firmware compile (prod profile, HMAC + pinned CA)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      # Throwaway CA so the CONFIG_PORTUNUS_TLS_USE_CUSTOM_CA embed succeeds.
      # Compile-only: this image is never flashed.
      - name: Generate throwaway CA
        run: bash scripts/generate_certs.sh --ip 127.0.0.1

      - name: Build with prod overlay
        working-directory: access_module
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.prod"
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Assert the prod image is deployable
        run: bash scripts/assert_secure_build.sh --prod access_module/build/config/sdkconfig.h

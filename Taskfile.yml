# https://taskfile.dev
# Install: go install github.com/go-task/task/v3/cmd/task@v3.49.1
#
# Usage:
#   task test              — run all tests
#   task test:server       — run server tests only
#   task build:server      — build the server binary
#   task build:server:arm64 — cross-compile for Raspberry Pi
#   task deploy:server     — build, copy, and restart on the Pi
#   task proto:gen         — regenerate protobuf code (Go + Nanopb)
#   task firmware:build    — build the ESP32 firmware
#   task ci:all            — full validation suite
#   task release           — validate + deploy server + build prod firmware
#   task clean             — remove build artifacts
#
# Platform:
#   Tasks assume a POSIX shell with GNU coreutils (Debian/Ubuntu, or the
#   espressif/idf image in CI). They are not written for Windows.
#
# Deployment:
#   Deploy tasks use SSH to push the server binary to a Raspberry Pi.
#   Configure the target in a .env file (gitignored) in the repo root:
#
#     DEPLOY_HOST=pi@192.168.1.100
#     DEPLOY_DIR=/opt/portunus
#     DEPLOY_SERVICE=portunus-server

version: "3"

dotenv: ['.env']

vars:
  # ── ESP-IDF environment ──────────────────────────────────────────────────
  # A plain Taskfile var would override the IDF_PATH that export.sh sets (Task
  # ranks Taskfile vars above the environment), so read the environment first
  # and only fall back to the default install location.
  # Override with: task firmware:build IDF_PATH=/path/to/esp-idf
  IDF_PATH:
    sh: echo "${IDF_PATH:-$HOME/esp/esp-idf}"

  # The ESP-IDF venv interpreter (it has nanopb and pyserial), so system
  # Python stays unmodified. export.sh sets IDF_PYTHON_ENV_PATH; without it,
  # use the newest idf5.5 venv the installer created.
  # Override with: task proto:gen IDF_PYTHON=/path/to/python
  IDF_PYTHON:
    sh: |
      if [ -n "${IDF_PYTHON_ENV_PATH:-}" ]; then echo "$IDF_PYTHON_ENV_PATH/bin/python"; exit 0; fi
      py=python3
      for c in "$HOME"/.espressif/python_env/idf5.5_py*_env/bin/python; do [ -x "$c" ] && py="$c"; done
      echo "$py"

  # ── Project paths ───────────────────────────────────────────────────────
  SERVER_DIR: server
  FIRMWARE_DIR: access_module

tasks:
  # ─── Aliases ──────────────────────────────────────────────────────────────

  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests
    cmds:
      - task: test:server
      - task: test:firmware

  clean:
    desc: Clean all build artifacts
    cmds:
      - task: clean:server

  # ─── Server ───────────────────────────────────────────────────────────────

  test:server:
    desc: Run all server tests
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -count=1 ./...

  test:server:verbose:
    desc: Run all server tests with verbose output
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -v -count=1 ./...

  test:server:race:
    desc: Run server tests with race detector
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -race -count=1 ./...

  test:server:coverage:
    desc: Run server tests with coverage report
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -coverprofile=coverage.out -count=1 ./...
      - go tool cover -func=coverage.out

  test:server:service:
    desc: Run service-layer tests only
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -v -count=1 ./internal/portunus/service/

  test:server:http:
    desc: Run HTTP handler tests only
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -v -count=1 ./internal/httpapi/

  test:server:store:
    desc: Run SQLite store tests only
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go test -v -count=1 ./internal/portunus/store/sqlite/

  build:server:
    desc: Build the server binary
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go build -o bin/portunus-server ./cmd/portunus-server

  build:server:arm64:
    desc: Cross-compile server binary for Raspberry Pi (arm64)
    dir: "{{.SERVER_DIR}}"
    env:
      GOOS: linux
      GOARCH: arm64
      # Explicit, not inherited: the Pi target depends on a pure-Go build.
      CGO_ENABLED: "0"
    cmds:
      - go build -o bin/portunus-server-linux-arm64 ./cmd/portunus-server

  run:server:local:
    desc: Run the server with the local profile (server/.env.local)
    dir: "{{.SERVER_DIR}}"
    dotenv: ['.env.local']
    cmds:
      - go run ./cmd/portunus-server

  run:server:ci:
    desc: Run the server with the ci profile (server/.env.ci — TLS + gRPC, in-memory DB)
    dir: "{{.SERVER_DIR}}"
    dotenv: ['.env.ci']
    cmds:
      - go run ./cmd/portunus-server

  run:server:prod:
    desc: Run the server with the prod profile (root .env + server/.env.prod)
    dir: "{{.SERVER_DIR}}"
    dotenv: ['../.env', '.env.prod']
    cmds:
      - go run ./cmd/portunus-server

  clean:server:
    desc: Clean server build artifacts
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go clean ./...
      - rm -rf bin coverage.out

  lint:server:
    desc: Run Go linters (requires golangci-lint)
    dir: "{{.SERVER_DIR}}"
    cmds:
      - golangci-lint run ./...

  vet:server:
    desc: Run go vet (built-in, no extra tools needed)
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go vet ./...

  fmt:server:
    desc: Check server code formatting (fails if unformatted)
    dir: "{{.SERVER_DIR}}"
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          printf 'Not gofmt-formatted:\n%s\nRun: task fmt:server:fix\n' "$unformatted" >&2
          exit 1
        fi

  fmt:server:fix:
    desc: Auto-format server code with gofmt
    dir: "{{.SERVER_DIR}}"
    cmds:
      - gofmt -w .

  tidy:server:check:
    desc: Fail if go.mod/go.sum are not tidy
    dir: "{{.SERVER_DIR}}"
    cmds:
      - go mod tidy -diff

  vuln:server:
    desc: Scan for known vulnerabilities reachable from server code (govulncheck)
    dir: "{{.SERVER_DIR}}"
    cmds:
      # go run @version rather than a go.mod tool directive: govulncheck's own
      # dependencies would otherwise join (and could bump) the server's build list.
      - go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # ─── Protobuf ─────────────────────────────────────────────────────────────

  proto:gen:
    desc: Regenerate protobuf code for Go and Nanopb
    cmds:
      - "{{.IDF_PYTHON}} scripts/proto_gen.py"

  proto:gen:go:
    desc: Regenerate Go protobuf stubs only
    cmds:
      - "{{.IDF_PYTHON}} scripts/proto_gen.py --go"

  proto:gen:nanopb:
    desc: Regenerate Nanopb C stubs for ESP32 only
    cmds:
      - "{{.IDF_PYTHON}} scripts/proto_gen.py --nanopb"

  # ─── TLS Certificates ─────────────────────────────────────────────────────

  # First run creates the CA. Afterwards it refuses unless given --sign-only
  # (new server cert, same CA) or --new-ca (rotation: reflash every module).
  certs:generate:
    desc: "Private CA + server TLS cert (task certs:generate -- --ip ADDR [--sign-only|--new-ca])"
    cmds:
      - bash scripts/generate_certs.sh {{.CLI_ARGS}}

  certs:verify:
    desc: Verify the cert chain (ca.pem → server.pem)
    cmds:
      - openssl verify -CAfile certs/ca.pem certs/server.pem

  # ─── Firmware ─────────────────────────────────────────────────────────────

  # firmware:build reuses whatever sdkconfig is in the tree, so it silently
  # inherits the last profile (often dev). It refuses an insecure config so a
  # dev image cannot pass for a deployable one. Use firmware:build:dev or
  # firmware:build:prod to pick a profile explicitly, or ALLOW_INSECURE=1 for a
  # compile-only check (ci:all).
  firmware:build:
    desc: Build the ESP32 firmware with the current sdkconfig (refuses insecure configs)
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    vars:
      ALLOW_INSECURE: '{{.ALLOW_INSECURE | default "0"}}'
    cmds:
      - |
        # Cheap early refusal before a long build; the authoritative check
        # runs on the compiled header afterwards.
        if [ "{{.ALLOW_INSECURE}}" != "1" ] && [ -f sdkconfig ]; then
          bad=$(grep -E '^CONFIG_PORTUNUS_(ENV_DEV|TLS_SKIP_VERIFY)=y|^# CONFIG_PORTUNUS_(USE_TLS|HMAC_ENABLED) is not set' sdkconfig || true)
          if [ -n "$bad" ]; then
            printf 'ERROR: sdkconfig has an insecure config:\n%s\n' "$bad" >&2
            echo "  Use firmware:build:prod / firmware:build:dev, or ALLOW_INSECURE=1 for a compile check." >&2
            exit 1
          fi
        fi
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        idf.py build
        if [ "{{.ALLOW_INSECURE}}" != "1" ]; then
          bash ../scripts/assert_secure_build.sh build/config/sdkconfig.h
        fi

  # Both profile builds delete sdkconfig so the profile overlay always wins,
  # which would also discard the per-device hardware settings set in
  # menuconfig. Save those first into sdkconfig.defaults.local (gitignored),
  # which both builds layer between sdkconfig.defaults and the profile.
  #
  # Saved: pins, wiring polarity (strike active-low, reed NC, arm button),
  # module type, feature switches, reader tuning, the unlock hold, and the
  # request timeout. Both "CONFIG_X=..." and "# CONFIG_X is not set" lines are
  # kept: a bool switched off is written in the second form, and dropping it
  # would turn it back on. Security settings (TLS, HMAC, dev mode) are not
  # saved: the profile decides them.
  firmware:_save-device-config:
    internal: true
    dir: "{{.FIRMWARE_DIR}}"
    cmds:
      - |
        if [ -f sdkconfig ]; then
          grep -E "^(# )?CONFIG_PORTUNUS_(SPI_|MFRC522_|DOOR_STRIKE_|REED_SWITCH_|LED_PIN|ARM_BUTTON_|MODULE_TYPE_|ENABLE_|UNLOCK_HOLD_MS|SERVER_REQUEST_TIMEOUT)[A-Z0-9_]*( is not set|=)" \
            sdkconfig > sdkconfig.defaults.local 2>/dev/null || true
        elif [ ! -f sdkconfig.defaults.local ]; then
          : > sdkconfig.defaults.local
        fi

  firmware:build:dev:
    desc: Build firmware with dev sdkconfig overlay
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - task: firmware:_save-device-config
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        rm -f sdkconfig
        DEFAULTS="sdkconfig.defaults"
        [ -f sdkconfig.defaults.local ] && DEFAULTS="${DEFAULTS};sdkconfig.defaults.local"
        DEFAULTS="${DEFAULTS};sdkconfig.defaults.dev"
        idf.py -D SDKCONFIG_DEFAULTS="${DEFAULTS}" build

  firmware:build:prod:
    desc: Build firmware with prod sdkconfig overlay (secrets come from NVS, not env)
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - task: firmware:_save-device-config
      - |
        rm -f sdkconfig
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.local;sdkconfig.defaults.prod"
        idf.py -D SDKCONFIG_DEFAULTS="$DEFAULTS" build
        # The overlay is trusted to be secure; this proves the compiled image is.
        bash ../scripts/assert_secure_build.sh --prod build/config/sdkconfig.h
        idf.py -D SDKCONFIG_DEFAULTS="$DEFAULTS" reconfigure > /dev/null 2>&1 || true

  # Compile-only checks in their own build directories, so they never touch
  # the working sdkconfig or build/. Their sdkconfig is regenerated every run:
  # IDF applies defaults only to symbols an existing sdkconfig lacks.
  firmware:_compile:
    internal: true
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        B="$PWD/build/{{.NAME}}"
        rm -f "$B/sdkconfig"
        idf.py -B "$B" -D SDKCONFIG="$B/sdkconfig" -D SDKCONFIG_DEFAULTS="{{.DEFAULTS}}" build

  firmware:compile:ci:
    desc: Compile check with the CI overlay (dev mode, no secrets; not deployable)
    cmds:
      - task: firmware:_compile
        vars: { NAME: ci, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.ci" }

  firmware:compile:prod:
    desc: Compile check with the prod overlay, then assert the image is deployable (needs access_module/certs/ca_cert.pem)
    cmds:
      - task: firmware:_compile
        vars: { NAME: ci-prod, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.prod" }
      - bash scripts/assert_secure_build.sh --prod {{.FIRMWARE_DIR}}/build/ci-prod/config/sdkconfig.h

  firmware:nvs:gen:
    desc: Generate NVS binary from nvs_config.csv (copy nvs_config.example.csv first)
    dir: "{{.FIRMWARE_DIR}}"
    cmds:
      - |
        if [ ! -f nvs_config.csv ]; then
          echo "ERROR: nvs_config.csv not found."
          echo "  cp nvs_config.example.csv nvs_config.csv"
          echo "  Then fill in real values (SSID, PSK, HMAC secret, server host)."
          exit 1
        fi
        NVS_SIZE=$(awk -F, '{gsub(/[ \t]/,"")} $1=="nvs"{print $5}' partitions.csv)
        [ -n "$NVS_SIZE" ] || { echo "ERROR: no nvs row in partitions.csv" >&2; exit 1; }
        mkdir -p build
        {{.IDF_PYTHON}} {{.IDF_PATH}}/components/nvs_flash/nvs_partition_generator/nvs_partition_gen.py \
          generate nvs_config.csv build/nvs.bin "$NVS_SIZE"
        echo "Generated build/nvs.bin ($(wc -c < build/nvs.bin) bytes)"

  firmware:nvs:flash:
    desc: "Flash build/nvs.bin to the nvs partition (offset from partitions.csv); run firmware:nvs:gen first"
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        if [ ! -f build/nvs.bin ]; then
          echo "ERROR: build/nvs.bin not found — run 'task firmware:nvs:gen' first"
          exit 1
        fi
        NVS_OFFSET=$(awk -F, '{gsub(/[ \t]/,"")} $1=="nvs"{print $4}' partitions.csv)
        [ -n "$NVS_OFFSET" ] || { echo "ERROR: no nvs row in partitions.csv" >&2; exit 1; }
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        esptool.py write_flash "$NVS_OFFSET" build/nvs.bin
        echo "NVS partition flashed. Now flash firmware with: task firmware:flash"

  firmware:flash:
    desc: Flash firmware to connected ESP32
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        idf.py flash

  firmware:monitor:
    desc: Open serial monitor to connected ESP32
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        idf.py monitor

  firmware:flash-monitor:
    desc: Flash firmware and open serial monitor
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        idf.py flash monitor

  firmware:menuconfig:
    desc: Open ESP-IDF menuconfig
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        idf.py menuconfig

  firmware:clean:
    desc: Clean firmware build directory
    dir: "{{.FIRMWARE_DIR}}"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        idf.py fullclean

  # ─── Firmware tests ───────────────────────────────────────────────────────
  # Tiers are partitioned by dependency coupling, mirroring test:server:*.
  #   unit         plain CMake + Unity, no ESP-IDF   access_module/test/unit
  #   component    IDF linux target, fake event bus  access_module/test/component
  #   integration  IDF linux target, real event bus  access_module/test/component
  # The component tier uses the host C/C++ compiler (the IDF linux toolchain
  # file is empty). To try another compiler without clobbering the default build:
  #   task test:firmware:component BUILD_TAG=gcc16 HOST_CC=/opt/gcc/bin/gcc \
  #     HOST_CXX=/opt/gcc/bin/g++ HOST_LDFLAGS=-Wl,-rpath,/opt/gcc/lib64

  test:firmware:
    desc: "All host-runnable firmware tests (unit, component, integration)"
    cmds:
      - task: test:firmware:unit
      - task: test:firmware:component
      - task: test:firmware:integration

  test:firmware:unit:
    desc: "Firmware unit tier, no ESP-IDF (PRESET=host|host-clang|host-asan|host-m32)"
    dir: "{{.FIRMWARE_DIR}}/test/unit"
    vars:
      PRESET: '{{.PRESET | default "host"}}'
    cmds:
      - cmake --preset {{.PRESET}}
      - cmake --build --preset {{.PRESET}}
      - ctest --preset {{.PRESET}}

  test:firmware:unit:m32:
    desc: "Firmware unit tier on the ESP32-S3 data model: ILP32, 64-bit time_t, unsigned char (needs gcc-multilib, g++-multilib)"
    cmds:
      - task: test:firmware:unit
        vars: { PRESET: host-m32 }

  # One IDF linux build of the component test app, then run it. Called by the
  # component and integration tasks below.
  #
  # Each build directory keeps its own sdkconfig (absolute path: idf.py
  # resolves a relative SDKCONFIG against the project), so variants never
  # share a config. IDF applies sdkconfig.defaults only to symbols an existing
  # sdkconfig lacks, so a changed defaults file or Kconfig would never reach a
  # local build: the build directory records a hash of those inputs and its
  # sdkconfig is regenerated when the hash changes. (CI builds fresh.)
  test:firmware:_variant:
    internal: true
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        {{if .HOST_CC}}export CC="{{.HOST_CC}}" CXX="{{.HOST_CXX}}" LDFLAGS="{{.HOST_LDFLAGS}}"{{end}}
        APP="$PWD/{{.FIRMWARE_DIR}}/test/component"
        BUILD="${APP}/build/{{.VARIANT}}{{if .BUILD_TAG}}-{{.BUILD_TAG}}{{end}}"
        INPUTS=$(cat "${APP}"/sdkconfig.defaults* "${APP}/main/Kconfig.projbuild" \
          "$PWD/{{.FIRMWARE_DIR}}/main/Kconfig.projbuild" | sha256sum | cut -c1-16)
        if [ -f "${BUILD}/sdkconfig" ] && [ "$(cat "${BUILD}/.sdkconfig-inputs" 2>/dev/null)" != "${INPUTS}" ]; then
          echo "Kconfig inputs changed: regenerating ${BUILD}/sdkconfig"
          rm -f "${BUILD}/sdkconfig"
        fi
        ARGS="-C ${APP} -B ${BUILD} -D SDKCONFIG=${BUILD}/sdkconfig -D SDKCONFIG_DEFAULTS={{.DEFAULTS}} {{.EXTRA}}"
        if [ ! -f "${BUILD}/CMakeCache.txt" ]; then
          idf.py --preview ${ARGS} set-target linux
        fi
        idf.py --preview ${ARGS} build
        echo "${INPUTS}" > "${BUILD}/.sdkconfig-inputs"
        "${BUILD}/portunus_host_tests.elf"

  test:firmware:component:
    desc: "Firmware component tier: IDF linux target, POSIX FreeRTOS, fake event bus (access point, PEU, heartbeat, WiFi reconnect, NVS, server_comm x3)"
    cmds:
      - "{{.FIRMWARE_DIR}}/test/component/check_kconfig_overrides.sh"   # COMP-05
      - task: test:firmware:_variant
        vars: { VARIANT: fake, DEFAULTS: "sdkconfig.defaults", EXTRA: "-DPORTUNUS_TEST_NVS=OFF" }
      - task: test:firmware:_variant
        vars: { VARIANT: peu, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.peu", EXTRA: "-DPORTUNUS_TEST_NVS=OFF" }
      - task: test:firmware:_variant
        vars: { VARIANT: hb, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.hb", EXTRA: "-DPORTUNUS_TEST_NVS=OFF" }
      - task: test:firmware:_variant
        vars: { VARIANT: wifi, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.wifi", EXTRA: "-DPORTUNUS_TEST_NVS=OFF" }
      - task: test:firmware:_variant
        vars: { VARIANT: nvs, DEFAULTS: "sdkconfig.defaults", EXTRA: "-DPORTUNUS_TEST_NVS=ON" }
      - task: test:firmware:_variant
        vars: { VARIANT: sc, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.sc", EXTRA: "-DPORTUNUS_TEST_SERVER_COMM=ON" }
      - task: test:firmware:_variant
        vars: { VARIANT: sc-nohmac, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.sc;sdkconfig.defaults.sc_nohmac", EXTRA: "-DPORTUNUS_TEST_SERVER_COMM=ON" }
      - task: test:firmware:_variant
        vars: { VARIANT: sc-peu, DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.sc;sdkconfig.defaults.peu", EXTRA: "-DPORTUNUS_TEST_SERVER_COMM=ON" }

  test:firmware:integration:
    desc: "Firmware integration tier: IDF linux target, real event bus and dispatcher task"
    cmds:
      - task: test:firmware:_variant
        vars: { VARIANT: real, DEFAULTS: "sdkconfig.defaults", EXTRA: "-DPORTUNUS_TEST_REAL_BUS=ON" }

  # Not part of test:firmware or ci:all: it needs the bench board and its
  # loopback jumpers (access_module/test/hardware/README.md). It replaces the
  # board's app (NVS is kept) and clicks the strike relay.
  test:firmware:hardware:
    desc: "Firmware hardware tier on a bench ESP32-S3 (PORT=/dev/ttyACM0, VARIANT=all|active_high|active_low)"
    requires:
      vars: [PORT]
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        {{.IDF_PYTHON}} scripts/hw_test.py --port "{{.PORT}}" --variant "{{.VARIANT | default "all"}}"

  # Phase 5b: also runs a throwaway server on this host (gRPC on the LAN
  # address the board uses, admin API on 127.0.0.1) for the duration of the run.
  test:firmware:hardware:net:
    desc: "Firmware hardware tier, network (PORT=/dev/ttyACM0, SERVER_IP=auto): WiFi, TLS, end-to-end, stacks"
    requires:
      vars: [PORT]
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        {{.IDF_PYTHON}} scripts/hw_test.py --port "{{.PORT}}" --net {{if .SERVER_IP}}--server-ip "{{.SERVER_IP}}"{{end}}

  # The hardware-tier apps run on a bench board; this only compiles them so
  # they cannot rot. The network app pins a CA at build time: if none exists
  # yet, a throwaway is made (hw_test.py replaces it with its own CA-A).
  test:firmware:hardware:compile:
    desc: "Compile the hardware-tier apps (both strike variants + network), no board needed"
    env:
      IDF_PATH: "{{.IDF_PATH}}"
    cmds:
      - |
        eval "$({{.IDF_PYTHON}} {{.IDF_PATH}}/tools/idf_tools.py export 2>/dev/null)"
        APP="$PWD/{{.FIRMWARE_DIR}}/test/hardware"
        for V in "active_high:sdkconfig.defaults" \
                 "active_low:sdkconfig.defaults;sdkconfig.defaults.active_low"; do
          N=${V%%:*}; D=${V#*:}
          idf.py -C "$APP" -B "$APP/build/$N" -D SDKCONFIG="$APP/build/$N/sdkconfig" \
            -D "SDKCONFIG_DEFAULTS=$D" build
        done
        NET="$APP/net"
        if [ ! -f "$NET/certs/ca_cert.pem" ]; then
          mkdir -p "$NET/certs"
          KEY=$(mktemp)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$KEY" -out "$NET/certs/ca_cert.pem" -days 1 \
            -subj "/CN=ci-compile-only" 2>/dev/null
          rm -f "$KEY"
        fi
        idf.py -C "$NET" -B "$NET/build/net" -D SDKCONFIG="$NET/build/net/sdkconfig" build

  # ─── Deploy ────────────────────────────────────────────────────────────────
  # Requires SSH key-based auth to the Pi. Configure target in .env:
  #   DEPLOY_HOST=pi@192.168.1.100
  #   DEPLOY_DIR=/opt/portunus
  #   DEPLOY_SERVICE=portunus-server

  deploy:server:
    desc: Build, copy, and restart the server on the Raspberry Pi
    deps: [build:server:arm64]
    vars:
      DEPLOY_HOST: '{{.DEPLOY_HOST | default "pi@192.168.1.100"}}'
      DEPLOY_DIR: '{{.DEPLOY_DIR | default "/opt/portunus"}}'
      DEPLOY_SERVICE: '{{.DEPLOY_SERVICE | default "portunus-server"}}'
    cmds:
      - echo "Deploying to {{.DEPLOY_HOST}}:{{.DEPLOY_DIR}}"
      # Back up current binary on the Pi
      - ssh {{.DEPLOY_HOST}} "sudo cp {{.DEPLOY_DIR}}/bin/portunus-server {{.DEPLOY_DIR}}/bin/portunus-server.prev 2>/dev/null || true"
      # Copy new binary
      - scp {{.SERVER_DIR}}/bin/portunus-server-linux-arm64 {{.DEPLOY_HOST}}:/tmp/portunus-server
      # Move into place and restart
      - ssh {{.DEPLOY_HOST}} "sudo mv /tmp/portunus-server {{.DEPLOY_DIR}}/bin/portunus-server && sudo chmod 755 {{.DEPLOY_DIR}}/bin/portunus-server && sudo systemctl restart {{.DEPLOY_SERVICE}}"
      # Verify
      - ssh {{.DEPLOY_HOST}} "sudo systemctl is-active {{.DEPLOY_SERVICE}}"
      - echo "Deploy complete"

  deploy:server:status:
    desc: Check the server status on the Raspberry Pi
    vars:
      DEPLOY_HOST: '{{.DEPLOY_HOST | default "pi@192.168.1.100"}}'
      DEPLOY_SERVICE: '{{.DEPLOY_SERVICE | default "portunus-server"}}'
    cmds:
      - ssh {{.DEPLOY_HOST}} "sudo systemctl status {{.DEPLOY_SERVICE}} --no-pager"

  deploy:server:logs:
    desc: Tail server logs on the Raspberry Pi
    vars:
      DEPLOY_HOST: '{{.DEPLOY_HOST | default "pi@192.168.1.100"}}'
      DEPLOY_SERVICE: '{{.DEPLOY_SERVICE | default "portunus-server"}}'
    cmds:
      - ssh {{.DEPLOY_HOST}} "sudo journalctl -u {{.DEPLOY_SERVICE}} -f"

  deploy:server:rollback:
    desc: Roll back to the previous server binary on the Raspberry Pi
    vars:
      DEPLOY_HOST: '{{.DEPLOY_HOST | default "pi@192.168.1.100"}}'
      DEPLOY_DIR: '{{.DEPLOY_DIR | default "/opt/portunus"}}'
      DEPLOY_SERVICE: '{{.DEPLOY_SERVICE | default "portunus-server"}}'
    cmds:
      - ssh {{.DEPLOY_HOST}} "sudo systemctl stop {{.DEPLOY_SERVICE}} && sudo cp {{.DEPLOY_DIR}}/bin/portunus-server.prev {{.DEPLOY_DIR}}/bin/portunus-server && sudo systemctl start {{.DEPLOY_SERVICE}}"
      - ssh {{.DEPLOY_HOST}} "sudo systemctl is-active {{.DEPLOY_SERVICE}}"
      - echo "Rollback complete"

  # ─── CI ───────────────────────────────────────────────────────────────────

  proto:check:
    desc: Verify generated protobuf code is up to date (for CI)
    cmds:
      - "{{.IDF_PYTHON}} scripts/proto_gen.py --check"

  ci:server:smoke:
    desc: Boot the ci profile and verify HTTPS + gRPC TLS come up (Linux/macOS)
    dir: "{{.SERVER_DIR}}"
    cmds:
      - |
        set -euo pipefail
        go build -o bin/portunus-server ./cmd/portunus-server
        set -a; . ./.env.ci; set +a
        ./bin/portunus-server & SRV=$!
        trap 'kill $SRV 2>/dev/null || true' EXIT
        code=""
        for _ in $(seq 1 30); do
          code=$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/admin/ui/login || true)
          [ "$code" = "200" ] && break
          sleep 0.2
        done
        [ "$code" = "200" ] || { echo "HTTPS smoke FAILED (last code: ${code:-none})"; exit 1; }
        echo "HTTPS OK: /admin/ui/login -> 200 over TLS"
        if echo | openssl s_client -connect 127.0.0.1:50051 -alpn h2 2>/dev/null | grep -q "BEGIN CERTIFICATE"; then
          echo "gRPC TLS OK: certificate presented on :50051"
        else
          echo "gRPC TLS smoke FAILED"; exit 1
        fi

  ci:server:
    desc: Full server CI check (vet, format, test with race detector, boot smoke)
    cmds:
      - task: vet:server
      - task: fmt:server
      - task: test:server:race
      - task: ci:server:smoke

  # Mirrors .github/workflows/ci.yml job for job, so a local pass predicts a
  # CI pass. Keep the two in step.
  ci:all:
    desc: "Full CI locally: server checks, proto drift, all firmware tiers, CI and prod compiles"
    cmds:
      - task: ci:server
      - task: tidy:server:check
      - task: vuln:server
      - task: build:server:arm64
      - task: proto:check
      - task: test:firmware
      - task: test:firmware:unit
        vars: { PRESET: host-asan }
      - task: test:firmware:unit:m32
      - task: test:firmware:hardware:compile
      - task: firmware:compile:ci
      - task: firmware:compile:prod

  release:
    desc: Full release — validate, deploy server, build prod firmware
    cmds:
      - task: ci:all
      - task: deploy:server
      - task: firmware:clean
      - task: firmware:build:prod
      - echo "Server deployed. Firmware built. Flash with 'task firmware:flash'"